<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .hlt {
        background-color: yellow;
      }
      .todo {
        cursor: pointer;
      }
      .outer {
        background-color: blue;
        height: 200px;
        width: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .inner-outer {
        background-color: aquamarine;
        height: 130px;
        width: 130px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .inner {
        background-color: brown;
        height: 50px;
        width: 50px;
      }
    </style>
  </head>
  <body>
    <div>
      <p id="welcome">Hello Everyone</p>
      <button id="colorChangeBtn">Change Color</button>
      <div id="drag" draggable="true">
        <p>Drag and Drop1</p>
        <p>Drag and Drop2</p>
        <p>Drag and Drop3</p>
        <p>Drag and Drop4</p>
      </div>

      <button id="changeText">Change Text</button>

      <button id="highlight">Click to highlight</button>
      <button id="addText">Add Text</button>
      <div>
        <button id="rmLast">Remove Drag Last Element</button>
      </div>

      <div>
        <ul class="todo">
          <li class="first">Workout</li>
          <li>Breakfast</li>
          <li>DSA</li>
          <li>Lunch</li>
          <li>Interview Prep</li>
          <li>Dinner</li>
        </ul>
      </div>

      <div class="outer">
        <div class="inner-outer">
          <div class="inner"></div>
        </div>
      </div>

      <div>
        <form id="submitForm">
          <h3>Form</h3>
          <div>
            <label for="nameField">Name:</label>
            <input type="text" name="name" id="nameField" placeholder="Name" />
          </div>
          <div>
            <label for="emailField">Email:</label>
            <input
              type="text"
              name="email"
              id="emailField"
              placeholder="Email"
            />
          </div>
          <button id="submitBtn" type="submit">Submit</button>
        </form>
      </div>
      <button id="clickBtn">Click</button>
      <div>
        <button id="toggle">Toggle Highlight</button>
      </div>
    </div>
  </body>
  <script src="./index.js" defer></script>
</html>
